[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-converter-skill"
version = "0.1.0"
description = "Local-first multi-format document to Markdown/HTML converter"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "docling>=2.97,<3",
  "typer>=0.16,<1",
  "rich>=13.9,<15",
]

[project.optional-dependencies]
marker = [
  "marker-pdf>=2,<3",
]
mineru = [
  "magic-pdf>=0.9,<2",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "pip-audit>=2.7,<3",
  "pip-licenses>=5.0,<6",
]

[project.scripts]
document-converter = "document_converter.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
