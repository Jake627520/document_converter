[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-converter-skill"
version = "0.2.0"
description = "Local-first multi-format document to Markdown/HTML converter"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "docling>=2.97,<3",
  "typer>=0.16,<1",
  "rich>=13.9,<15",
  # PDF text-layer detection: without it the detector falls back to its built-in
  # stream analyzer, so classification would vary with the local environment.
  "pypdf>=5,<7",
]

[project.optional-dependencies]
marker = [
  "marker-pdf>=2,<3",
]
mineru = [
  # MinerU 4.x, which provides the mineru-kit command the adapter runs. The
  # older magic-pdf package is AGPL-3.0 and offers no mineru-kit.
  "mineru>=4,<5",
]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
]
dev = [
  # pytest 8 and pytest-cov 6 are held back by PYSEC-2026-1845, which the
  # dependency audit reports; the fix landed in pytest 9.0.3.
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  # Starlette 1.x runs its TestClient on httpx2 and warns when only httpx is
  # present; older Starlette within the fastapi range still imports httpx.
  "httpx>=0.27,<1",
  "httpx2>=2,<3",
  "pip-audit>=2.7,<3",
  "pip-licenses>=5.0,<6",
]

[project.scripts]
document-converter = "document_converter.cli:app"

[tool.setuptools.packages.find]
include = ["document_converter*"]
exclude = ["tests*", "openspec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=document_converter --cov-report=term-missing --cov-fail-under=80"
