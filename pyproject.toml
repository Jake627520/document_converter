[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-converter-skill"
version = "0.2.0"
description = "Local-first multi-format document to Markdown/HTML converter"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "typer>=0.16,<1",
  "rich>=13.9,<15",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
docling = [
  "docling>=2.97,<3",
]
marker = [
  "marker-pdf>=2,<3",
]
mineru = [
  # MinerU 4.x, which provides the mineru-kit command the adapter runs. The
  # older magic-pdf package is AGPL-3.0 and offers no mineru-kit.
  "mineru>=4,<5",
]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
]
# 一鍵裝齊常用轉換能力（不含 marker/mineru 授權敏感套件）
full = [
  "document-converter-skill[docling,web]",
]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "httpx>=0.27,<1",
  "httpx2>=2,<3",
  "pip-audit>=2.7,<3",
  "pip-licenses>=5.0,<6",
]

[project.scripts]
document-converter = "document_converter.cli:app"

[tool.setuptools.packages.find]
include = ["document_converter*"]
exclude = ["tests*", "openspec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=document_converter --cov-report=term-missing --cov-fail-under=80"
