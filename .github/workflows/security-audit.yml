name: Security & License Audit

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - 'README*.md'
      - 'CHANGELOG.md'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - 'README*.md'
      - 'CHANGELOG.md'
      - '.gitignore'
  # A CVE published after the last push would otherwise wait for the next
  # change. The repo is public, so these minutes are free; GitHub disables
  # the schedule after 60 days without repository activity.
  schedule:
    - cron: '17 2 * * 1'

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs only read the repository; no job pushes, comments, or releases.
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret & Credential Scan
    # A scheduled run brings no new commits to scan, and has no base commit.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        # Pinned to audited release tag v3.99.7 (commit 31ce31ee1abbcc7dc8eee5764c17121c3044c8b2)
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install ".[dev]"
          pip uninstall -y document-converter-skill

      - name: Run pip-audit
        run: |
          pip-audit --strict --desc

  license-audit:
    name: License Compliance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Check core dependencies licenses
        run: |
          pip-licenses --format=markdown
          pip-licenses --fail-on="AGPL;GPLv3"
