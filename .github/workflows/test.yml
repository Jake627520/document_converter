name: Test & Coverage

on:
  push:
    branches: [ "main", "feat/*", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The web extra is required for coverage: without FastAPI the whole
          # tests/test_web_app.py suite skips and web_app.py reports 0%.
          pip install -e ".[dev,web]"

      - name: Run test suite with coverage
        run: |
          # The release runtime tests need the isolated release environments;
          # the release-runtime job below builds them and runs that file.
          pytest --cov=document_converter --cov-report=term-missing --cov-report=xml \
            --ignore=tests/test_release_packaging.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

  release-runtime:
    # Builds build/private-release/venv (text) and venv-pdf (pdf) the way
    # scripts/packaging/bootstrap_macos.sh does, then runs
    # tests/test_release_packaging.py from venv-pdf as docs-release/macos.md does.
    #
    # This checks the pinned versions, not the shipped artifacts: the .lock
    # hashes name macOS arm64 wheels, so on Linux the environments come from the
    # unhashed .txt pins - the same versions, as Linux wheels.
    #
    # Neither environment gets pytest or any other test dependency, and the
    # project itself is not installed: the launcher imports it from the checkout.
    name: Release runtime tests (pinned versions, Linux wheels)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Build the isolated release environments
        env:
          BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          for profile in "requirements-macos-arm64 venv" "requirements-macos-arm64-pdf venv-pdf"; do
            set -- $profile
            uv venv --python "$BUILD_PYTHON" --no-project --clear "build/private-release/$2"
            uv pip sync --python "build/private-release/$2/bin/python" \
              --index-url https://pypi.org/simple --only-binary :all: \
              "scripts/packaging/$1.txt"
          done

      - name: Run the release runtime tests
        run: |
          build/private-release/venv-pdf/bin/python -I -m unittest discover \
            -s tests -p test_release_packaging.py -v 2>&1 | tee release-tests.log
          # A missing environment skips its tests instead of failing them.
          if grep -q "skipped" release-tests.log; then
            echo "::error::Release runtime tests were skipped"
            exit 1
          fi
