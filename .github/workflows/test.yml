name: Test & Coverage

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - 'README*.md'
      - 'CHANGELOG.md'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - 'README*.md'
      - 'CHANGELOG.md'
      - '.gitignore'

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Run test suite with coverage
        run: |
          pytest --cov=document_converter --cov-report=term-missing --cov-report=xml --cov-fail-under=80 \
            --ignore=tests/test_release_packaging.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

  windows:
    # The first Windows check: a from-source install with the web extra, the
    # test suite and the AGENTS.md CLI checks, without Docling: the docling
    # job runs on Windows too. No coverage gate; the Linux job holds it. The repo is
    # public, so these minutes are free; a private repo pays twice the Linux
    # rate for a Windows runner.
    name: Tests on Windows (Python 3.12, no Docling)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Run the test suite
        run: pytest -rs --ignore=tests/test_release_packaging.py

      - name: Run the CLI checks
        run: |
          document-converter --help
          document-converter list-engines

  docling:
    # The test job installs no document engine, so the tests that convert a
    # real PDF through Docling skip there. This job installs the `docling`
    # extra the way a from-source user does, from PyPI only, and runs the suite
    # with nothing skipped.
    #
    # HF_HUB_OFFLINE stops Docling from downloading layout or OCR models: no
    # test checks model output, and a download would make the job slower and
    # dependent on Hugging Face. The model pipeline therefore fails fast and
    # the engine chain falls back to docling-native, as it does on a machine
    # without the models.
    #
    # It runs on Windows as well, so Docling and PDF conversion are checked
    # there.
    name: Tests with Docling installed on ${{ matrix.os }} (no model download)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Longer than the other jobs' 15: with a cold pip cache this job downloads
    # PyTorch. A warm Linux run takes about three minutes; Windows is slower.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      HF_HUB_OFFLINE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project with the docling extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web,docling]"

      - name: Run the test suite with nothing skipped
        run: |
          # `shell: bash` runs with -eo pipefail, so a failing pytest fails the
          # step through tee; -rs lists each skip as a "SKIPPED" line.
          pytest -rs --ignore=tests/test_release_packaging.py 2>&1 | tee docling-tests.log
          if grep -q "^SKIPPED" docling-tests.log; then
            echo "::error::Tests were skipped although Docling is installed"
            exit 1
          fi

  docling-models:
    # The docling job keeps Docling offline, so it never checks what a full
    # from-source install is for: reading a scan or a photo with Docling's
    # layout model and RapidOCR. This job lets them download (the layout model
    # from Hugging Face, cached between runs; RapidOCR's from ModelScope) and
    # reads a drawn page back, English and Traditional Chinese.
    # REQUIRE_DOCLING_MODELS makes tests/conftest.py collect that module.
    name: Docling OCR with downloaded models (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUIRE_DOCLING_MODELS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install a font with Chinese glyphs for the drawn page
        run: sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei

      - name: Install the project with the docling extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docling]"

      - name: Cache the Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-docling-${{ hashFiles('pyproject.toml') }}

      - name: Read text back through Docling's models
        run: pytest -rs tests/test_docling_ocr_models.py

  macos:
    # Apple's Vision framework exists only on macOS, so this is where the
    # apple-vision engine meets the real recognizer: a page drawn with a system
    # font is read back, English and Traditional Chinese, as a photo and as a
    # scanned PDF. REQUIRE_APPLE_VISION makes tests/conftest.py collect that
    # module even if PyObjC failed to install, so it fails instead of
    # vanishing. The office extra runs the Word/PowerPoint/Excel tests too.
    # macos-latest is Apple Silicon, like the app; the repo is public, so
    # these minutes are free.
    name: Tests on macOS with Apple Vision OCR
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      REQUIRE_APPLE_VISION: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project with the apple-vision and office extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web,apple-vision,office]"

      - name: Read text back through Apple Vision
        run: pytest -rs tests/test_apple_vision_macos.py tests/test_apple_vision.py

      - name: Run the test suite
        run: pytest -rs --ignore=tests/test_release_packaging.py

      - name: Run the CLI checks
        run: |
          document-converter --help
          document-converter list-engines | tee engines.txt
          grep -Eq "^apple-vision +installed" engines.txt
          grep -Eq "^docling-office +installed" engines.txt

      # The office-ocr app pins macOS arm64 wheels by hash, PyObjC among them,
      # so only a Mac can install its lock. This installs it as the build
      # does and runs the release from it, unfrozen, with the real Vision
      # framework. Freezing it with PyInstaller needs the audited Python
      # build and stays a step on the owner's Mac (docs-release/macos.md).
      - name: Install the office-ocr release environment from its lock
        run: |
          python -m pip install uv
          uv venv --python "$(command -v python)" --no-project --clear build/private-release/venv-office-ocr
          uv pip sync --python build/private-release/venv-office-ocr/bin/python \
            --index-url https://pypi.org/simple --require-hashes --only-binary :all: \
            scripts/packaging/requirements-macos-arm64-office-ocr.lock

      - name: Run the office-ocr release from its pinned environment
        run: |
          set -o pipefail
          build/private-release/venv-office-ocr/bin/python -I -m unittest discover -v \
            -s tests -p test_release_packaging.py -k OfficeOcr 2>&1 | tee office-ocr-release.log
          if grep -q "skipped" office-ocr-release.log; then
            echo "::error::office-ocr release tests were skipped"
            exit 1
          fi

  release-runtime:
    name: Release runtime tests (pinned versions, Linux wheels)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: 'scripts/packaging/requirements-macos-arm64.txt'

      - name: Install uv
        run: python -m pip install uv

      - name: Build the isolated release environments
        env:
          BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          for profile in "requirements-macos-arm64 venv" "requirements-macos-arm64-pdf venv-pdf" \
                         "requirements-macos-arm64-office-ocr venv-office-ocr"; do
            set -- $profile
            uv venv --python "$BUILD_PYTHON" --no-project --clear "build/private-release/$2"
            # PyObjC is macOS-only and has no Linux wheel. Without it the
            # office-ocr release still runs here; its OCR answers that it
            # needs macOS, which the tests expect on Linux.
            grep -v '^pyobjc' "scripts/packaging/$1.txt" > "build/private-release/$1.linux.txt"
            uv pip sync --python "build/private-release/$2/bin/python" \
              --index-url https://pypi.org/simple --only-binary :all: \
              "build/private-release/$1.linux.txt"
          done

      - name: Run the release runtime tests
        run: |
          build/private-release/venv-pdf/bin/python -I -m unittest discover \
            -s tests -p test_release_packaging.py -v 2>&1 | tee release-tests.log
          if grep -q "skipped" release-tests.log; then
            echo "::error::Release runtime tests were skipped"
            exit 1
          fi
